<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TransforM — Celebrity Chair</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; }
.ad {
  width: 100vw; height: 100vh;
  position: relative;
  background: #050505;
  font-family: 'Cairo', sans-serif;
}
.hero {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center top;
}
.overlay {
  position: absolute; inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(5,5,5,0.15) 0%,
    rgba(5,5,5,0.0) 30%,
    rgba(5,5,5,0.0) 55%,
    rgba(5,5,5,0.75) 80%,
    rgba(5,5,5,0.95) 100%
  );
}
.bottom {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 3vh 5vw 4vh;
  display: flex;
  flex-direction: column;
  gap: 1.2vh;
}
.locations {
  display: flex;
  gap: 1.5vw;
  align-items: center;
  flex-wrap: wrap;
}
.loc-badge {
  background: rgba(212,180,125,0.18);
  border: 1px solid #d4b47d;
  color: #d4b47d;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1vw;
  letter-spacing: 0.12em;
  padding: 0.4vh 1.2vw;
  font-style: italic;
  white-space: nowrap;
}
.divider {
  width: 1px; height: 2.5vh;
  background: rgba(212,180,125,0.4);
}
.cta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.cta-text {
  color: #e8e1d8;
  font-size: 1.3vw;
  direction: rtl;
  line-height: 1.5;
}
.cta-text strong {
  color: #fff;
  font-weight: 700;
}
.cta-btn {
  background: #d4b47d;
  color: #050505;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4vw;
  font-weight: 700;
  letter-spacing: 0.12em;
  padding: 1.2vh 2.5vw;
  border: none;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
}
.phone {
  color: #d4b47d;
  font-size: 1.1vw;
  letter-spacing: 0.08em;
  font-family: 'Cormorant Garamond', serif;
  direction: ltr;
  text-align: center;
}
</style>
</head>
<body>
<div class="ad">
  <img class="hero" src="./celebrity-chair.jpeg" alt="TransforM Celebrity Chair">
  <div class="overlay"></div>
  <div class="bottom">
    <div class="locations">
      <div class="loc-badge">📍 CITY STARS — GATE 7</div>
      <div class="divider"></div>
      <div class="loc-badge">📍 SOFITEL DOWNTOWN CAIRO</div>
    </div>
    <div class="cta-row">
      <div class="cta-text">
        <strong>احجزي استشارتك المجانية دلوقتي</strong><br>
        إكستنشن طبيعي ١٠٠٪ — يدوم حتى ١٢ شهر
      </div>
      <div class="cta-btn">BOOK NOW</div>
    </div>
    <div class="phone">0100 978 0008 &nbsp;|&nbsp; 0100 454 5700</div>
  </div>
</div>
</body>
</html>
