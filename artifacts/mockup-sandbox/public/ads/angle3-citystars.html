<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TransforM — City Stars</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; }
.ad {
  width: 100vw; height: 100vh;
  background: #050505;
  display: flex;
  flex-direction: column;
}
.image-panel {
  flex: 1;
  position: relative;
  overflow: hidden;
}
.hero {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center 20%;
}
.img-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(5,5,5,0.1) 0%, rgba(5,5,5,0.55) 100%);
}
.img-label {
  position: absolute;
  top: 3vh; right: 4vw;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.2vw;
  letter-spacing: 0.3em;
  color: #d4b47d;
  text-transform: uppercase;
  background: rgba(5,5,5,0.6);
  padding: 0.5vh 1.2vw;
  border-left: 2px solid #d4b47d;
}
.bottom-panel {
  background: #050505;
  padding: 3vh 5vw;
  display: flex;
  flex-direction: column;
  gap: 1.5vh;
  border-top: 1px solid rgba(212,180,125,0.25);
}
.eyebrow {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1vw;
  letter-spacing: 0.4em;
  color: #d4b47d;
  text-transform: uppercase;
}
.headline-ar {
  font-family: 'Cairo', sans-serif;
  font-size: 3.5vw;
  font-weight: 700;
  color: #fff;
  direction: rtl;
  line-height: 1.25;
}
.subline {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4vw;
  font-style: italic;
  color: rgba(232,225,216,0.75);
}
.location-strip {
  display: flex;
  align-items: center;
  gap: 1.5vw;
  margin-top: 0.5vh;
}
.pin {
  color: #d4b47d;
  font-size: 1.2vw;
}
.loc-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.3vw;
  color: #d4b47d;
  letter-spacing: 0.12em;
  font-weight: 600;
  text-transform: uppercase;
}
.loc-sub {
  font-family: 'Cairo', sans-serif;
  font-size: 1vw;
  color: rgba(232,225,216,0.6);
}
.cta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.cta-btn {
  background: #d4b47d;
  color: #050505;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.3vw;
  font-weight: 700;
  letter-spacing: 0.2em;
  padding: 1.2vh 2.8vw;
  text-transform: uppercase;
  white-space: nowrap;
}
.phone {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.2vw;
  color: rgba(232,225,216,0.6);
  direction: ltr;
  letter-spacing: 0.05em;
}
</style>
</head>
<body>
<div class="ad">
  <div class="image-panel">
    <img class="hero" src="./extensions-display.png" alt="TransforM Extensions">
    <div class="img-overlay"></div>
    <div class="img-label">100% Natural Hair</div>
  </div>
  <div class="bottom-panel">
    <div class="eyebrow">City Stars — Exclusively</div>
    <div class="headline-ar">إكستنشن بمعيار مختلف<br>في قلب سيتي ستارز</div>
    <div class="subline">Keratin Bond · Tape-In · Gushli Weft · Micro-Ring</div>
    <div class="location-strip">
      <span class="pin">📍</span>
      <div>
        <div class="loc-text">City Stars Mall — Gate 7</div>
        <div class="loc-sub">مصر الجديدة — بجانب كافيه سوبريم</div>
      </div>
    </div>
    <div class="cta-row">
      <div class="cta-btn">راسلينا دلوقتي</div>
      <div class="phone">0100 978 0008</div>
    </div>
  </div>
</div>
</body>
</html>
