<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TransforM — Sofitel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; }
.ad {
  width: 100vw; height: 100vh;
  background: #050505;
  position: relative;
}
.hero {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center 15%;
}
.overlay {
  position: absolute; inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(5,5,5,0.08) 0%,
    rgba(5,5,5,0.05) 40%,
    rgba(5,5,5,0.7) 70%,
    rgba(5,5,5,0.96) 100%
  );
}
.top-badge {
  position: absolute;
  top: 4vh; left: 5vw;
  display: flex;
  flex-direction: column;
  gap: 0.8vh;
}
.brand-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.8vw;
  letter-spacing: 0.4em;
  color: #d4b47d;
  text-transform: uppercase;
}
.brand-rule {
  width: 3vw; height: 1px;
  background: #d4b47d;
}
.at-sofitel {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1vw;
  letter-spacing: 0.2em;
  color: rgba(232,225,216,0.8);
  text-transform: uppercase;
  font-style: italic;
}
.content {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 4vh 5vw 5vh;
  display: flex;
  flex-direction: column;
  gap: 1.5vh;
}
.headline {
  font-family: 'Cormorant Garamond', serif;
  font-size: 5.5vw;
  font-weight: 700;
  color: #fff;
  line-height: 1.1;
  letter-spacing: -0.01em;
}
.headline span {
  color: #d4b47d;
  font-style: italic;
}
.ar-sub {
  font-family: 'Cairo', sans-serif;
  font-size: 1.8vw;
  color: rgba(232,225,216,0.8);
  direction: rtl;
  font-weight: 400;
}
.details-row {
  display: flex;
  gap: 3vw;
  align-items: flex-start;
  margin-top: 0.5vh;
}
.detail-item {
  display: flex;
  flex-direction: column;
  gap: 0.3vh;
}
.detail-label {
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.85vw;
  letter-spacing: 0.3em;
  color: #d4b47d;
  text-transform: uppercase;
}
.detail-value {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.2vw;
  color: #e8e1d8;
}
.cta-row {
  display: flex;
  align-items: center;
  gap: 2vw;
  margin-top: 0.5vh;
}
.cta-btn {
  background: transparent;
  color: #d4b47d;
  border: 1px solid #d4b47d;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.2vw;
  font-weight: 600;
  letter-spacing: 0.25em;
  padding: 1.2vh 2.8vw;
  text-transform: uppercase;
}
.cta-btn-solid {
  background: #d4b47d;
  color: #050505;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.2vw;
  font-weight: 700;
  letter-spacing: 0.2em;
  padding: 1.2vh 2.8vw;
  text-transform: uppercase;
}
</style>
</head>
<body>
<div class="ad">
  <img class="hero" src="./treatments.png" alt="TransforM Sofitel">
  <div class="overlay"></div>
  <div class="top-badge">
    <div class="brand-name">TransforM</div>
    <div class="brand-rule"></div>
    <div class="at-sofitel">at Sofitel Downtown Cairo</div>
  </div>
  <div class="content">
    <div class="headline">Where luxury<br>meets <span>hair mastery.</span></div>
    <div class="ar-sub">في سوفيتيل داون تاون — تجربة تستحقيها</div>
    <div class="details-row">
      <div class="detail-item">
        <div class="detail-label">Location</div>
        <div class="detail-value">Sofitel Downtown Cairo<br>Lower Level — Next to Banque Misr</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Valet Parking</div>
        <div class="detail-value">Hotel valet on arrival</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Book</div>
        <div class="detail-value">0100 454 5700</div>
      </div>
    </div>
    <div class="cta-row">
      <div class="cta-btn-solid">BOOK A SESSION</div>
      <div class="cta-btn">WhatsApp Us</div>
    </div>
  </div>
</div>
</body>
</html>
