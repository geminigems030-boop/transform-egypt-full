    description: "High-end editorial fashion photography of a woman with beautiful long voluminous flowing hair extensions, dark background, cinematic lighting, gold accents"
    aspect_ratio: "4:3"
  - path: "artifacts/transform-egypt/public/images/service-lashes.png"
    description: "Macro beauty photography of perfectly styled luxury eyelash extensions, glowing skin, soft cinematic lighting"
    aspect_ratio: "4:3"
  - path: "artifacts/transform-egypt/public/images/service-brows.png"
    description: "Close-up of perfect microbladed eyebrows on a model, flawless skin, luxury beauty salon aesthetic"
    aspect_ratio: "4:3"
  - path: "artifacts/transform-egypt/public/images/service-facials.png"
    description: "Luxury spa facial treatment, soft glowing lighting, serene atmosphere, warm tones, high-end skincare aesthetic"
    aspect_ratio: "4:3"
  - path: "artifacts/transform-egypt/public/images/salon-bg.png"
    description: "Interior of an ultra-luxury Dubai-style beauty salon, black and gold decor, warm ambient lighting, elegant mirrors, highly sophisticated"
    aspect_ratio: "16:9"
  - path: "artifacts/transform-egypt/public/images/founder.png"
