packages:
  "framer-motion": "For premium page transitions, scroll animations, and stagger effects"
  "lucide-react": "For beautiful consistent SVG icons"
  "@radix-ui/react-slider": "For product filtering price ranges"
  "clsx": "For merging tailwind classes efficiently"
  "tailwind-merge": "For merging tailwind classes efficiently"

images:
